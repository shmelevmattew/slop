<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Вход — админ-панель</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fcfcfc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
  }
  .login {
    width: 100%;
    max-width: 340px;
    padding: 32px 28px;
    background: #fff;
    border: 1px solid #e6e6e6;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
  }
  .login h1 { margin: 0 0 4px; font-size: 20px; }
  .login .hint { margin: 0 0 20px; font-size: 13px; color: #888; }
  .login input {
    width: 100%;
    padding: 11px 13px;
    font-size: 15px;
    border: 1px solid #d8d8d8;
    border-radius: 9px;
    outline: none;
  }
  .login input:focus { border-color: #4513eb; box-shadow: 0 0 0 3px rgba(69, 19, 235, 0.12); }
  .login button {
    width: 100%;
    margin-top: 14px;
    padding: 11px 13px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #4513eb;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
  }
  .login button:hover { background: #3a0fc7; }
  .error {
    margin: 0 0 14px;
    padding: 9px 12px;
    font-size: 13px;
    color: #b00020;
    background: #fdecef;
    border-radius: 8px;
  }
</style>
</head>
<body>
<form class="login" method="POST" action="__ADMIN_BASE__/login">
  <h1>Админ-панель</h1>
  <p class="hint">Введите пароль для входа</p>
  __ERROR__
  <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
  <button type="submit">Войти</button>
</form>
</body>
</html>
